<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 微信、LINE、FB 分享時顯示的標題與描述 -->
    <meta property="og:title" content="《千橡》2025年秋">
    <meta property="og:description" content="CCCA JOURNAL 第80期">

    <style>
        /* 讓頁面滿版，沒有多餘的白邊 */

            height: 100%;
            background-color: #f0f2f5;

        }

</head>

    <div class="magazine-container">
