<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- 微信、LINE、FB 分享時顯示的標題與描述 -->
    <meta property="og:title" content="《千橡》2025年秋">
    <meta property="og:description" content="CCCA JOURNAL No.80">
    <meta property="og:image"  content="https://angelina-sandbox.github.io/ccca-journal-demo/images/cover_heyzine.jpg">

    <title>《千橡》2025年秋 - CCCA JOURNAL No.80</title>

    <style>
        /* 消除页面默认边距，实现无缝铺满 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a; /* 优雅的深色背景，衬托纸张翻页效果 */
        }

        /* 全屏无边框响应式 iframe 容器 */
        .fp-iframe {
            width: 100vw;
            height: 100vh;
            border: none !important;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Heyzine 3D 翻页引擎全屏无缝嵌入 -->
    <iframe
        allowfullscreen="allowfullscreen"
        allow="autoplay; fullscreen; clipboard-write"
        scrolling="no"
        class="fp-iframe"
        src="https://heyzine.com/flip-book/f59593e33f.html">
    </iframe>

</body>
</html>
