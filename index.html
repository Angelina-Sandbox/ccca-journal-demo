<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《千橡》2025 秋 - 與線上版本導覽</title>
    <style>
        /* 基礎樣式設定 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .header-title {
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
            color: #111;
        }
        /* 清單項目樣式（參考妳提供的截圖版型） */
        .list-item {
            display: flex;
            align-items: flex-start;
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.2s ease;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-item:hover {
            background-color: #f5f5f5;
        }
        /* 左側封面圖片 */
        .item-image {
            width: 100px;
            height: 75px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 15px;
            flex-shrink: 0;
            background-color: #e0e0e0;
        }
        /* 右側文字區域 */
        .item-content {
            flex-grow: 1;
        }
        .item-title {
            font-size: 16px;
            font-weight: bold;
            color: #222;
            margin: 0 0 6px 0;
            line-height: 1.4;
        }
        .item-desc {
            font-size: 13px;
            color: #888;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">《千橡》2025 秋季刊 - 精選雜誌與線上版本</div>

    <!-- 1. 直接連結到 PDF 雜誌 -->
    <a href="./pdf/CCCA_Magazine_Perfect_Bookmarks_compressed.pdf" class="list-item">
        <img src="images/cover_pdf.jpg" alt="PDF封面" class="item-image">
        <div class="item-content">
            <h2 class="item-title">《千橡》2025 - PDF 完整版瀏覽</h2>
            <p class="item-desc">CCCA Journal · 點擊直接開啟 PDF 檔案閱讀</p>
        </div>
    </a>

    <!-- 2. 連結到 AnyFlip 版本 -->
    <a href="anyflip.html" class="list-item" target="_blank">
        <img src="./images/cover_anyflip.jpg" alt="AnyFlip 封面" class="item-image">
        <div class="item-content">
            <h2 class="item-title">《千橡》2025 - AnyFlip 翻頁電子版</h2>
            <p class="item-desc">CCCA Journal · 第 80 · 期線上翻頁互動體驗</p>
        </div>
    </a>

    <!-- 3. 連結到 Heyzine  (Black Ice) 版本 -->
    <a href="heyzine.html" class="list-item">
        <img src="./images/cover_heyzine.jpg" alt="Heyzine 封面" class="item-image">
        <div class="item-content">
            <h2 class="item-title">《千橡》2025 - Heyzine 翻頁電子版</h2>
            <p class="item-desc">CCCA Journal ·  第 80 期 · Heyzine 專案排版與內容展示</p>
        </div>
    </a>

    <!-- 4. 連結到 PubHTML5 版本 -->
    <a href="pubhtml5.html" class="list-item" target="_blank">
        <img src="./images/cover_PubHTML5.jpg" alt="PubHTML5 封面" class="item-image">
        <div class="item-content">
            <h2 class="item-title">《千橡》2025 - PubHTML5 線上翻頁版</h2>
            <p class="item-desc">CCCA Journal · 第 80 期 · 行動裝置流暢閱讀版 (若有廣告請自行關閉）</p>
        </div>
    </a>

</div>

</body>
</html>
