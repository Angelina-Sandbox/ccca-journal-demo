          if (level > 0) { el.className = 'lvl' + level; }
        }
        var wrap = document.createElement('div');
        if (it.items && it.items.length) {
          wrap.className = 'qx-toc-group';
          var row = document.createElement('div');
          row.className = 'qx-toc-row';
          var arrow = document.createElement('button');
          arrow.type = 'button';
          arrow.className = 'qx-toc-arrow';
          arrow.setAttribute('aria-expanded', 'false');
          arrow.setAttribute('aria-label', '展開');
          arrow.textContent = '▶';
          var kids = document.createElement('div');
          kids.className = 'qx-toc-children';
          kids.hidden = true;
          arrow.addEventListener('click', function(){
            var open = kids.hidden;
            kids.hidden = !open;
            arrow.setAttribute('aria-expanded', String(open));
            arrow.classList.toggle('open', open);
          });
          row.appendChild(arrow);
          row.appendChild(el);
          wrap.appendChild(row);
          return buildToc(it.items, level + 1).then(function(childFrag){
            kids.appendChild(childFrag);
            wrap.appendChild(kids);
            return wrap;
          });
        }
        wrap.appendChild(el);
        return wrap;
      });
    });
    return Promise.all(jobs).then(function(wraps){
      wraps.forEach(function(w){ frag.appendChild(w); });
      return frag;
    });
  }
  function loadOutline(doc){
    doc.getOutline().then(function(outline){
      if (!outline || !outline.length) {
        tocBox.textContent = '本期 PDF 没有目录书签。';
        return null;
      }
      return buildToc(outline, 0);
    }).then(function(frag){
      if (!frag) { return; }
      tocBox.innerHTML = '';
      tocBox.appendChild(frag);
    }).catch(function(){
      tocBox.textContent = '本期 PDF 没有目录书签。';
    });
  }
  
  
  
  
  
  function getRemovePages(){
    if (window.QX_REMOVE_PAGES && window.QX_REMOVE_PAGES.length) {
      return window.QX_REMOVE_PAGES.slice();
    }
    var r = params.get('remove');
    if (r) {
      return r.split(',').map(function(s){ return parseInt(s, 10); }).filter(function(n){ return n > 0; });
    }
    return null;
  }
  function loadPdfLib(){
    return new Promise(function(resolve, reject){
      if (window.PDFLib) { resolve(window.PDFLib); return; }
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';
      s.onload = function(){ resolve(window.PDFLib); };
      s.onerror = function(){ reject(new Error('pdf-lib 載入失敗')); };
      document.head.appendChild(s);
    });
  }
  
  function readPageLabels(doc){
    var ctx = doc.context;
    var PDFName = window.PDFLib.PDFName;
    var numPages = doc.getPageCount();
    var labels = [];
    for (var i = 0; i < numPages; i++) { labels.push(String(i + 1)); }
    var plRef = doc.catalog.get(PDFName.of('PageLabels'));
    if (!plRef) { return labels; }
    var pl = ctx.lookup(plRef);
    if (!pl || !pl.get) { return labels; }
    var numsRef = pl.get(PDFName.of('Nums'));
    if (!numsRef) { return labels; }
    var nums = ctx.lookup(numsRef);
    if (!nums || !nums.asArray) { return labels; }
    var arr = nums.asArray();
    for (var k = 0; k + 1 < arr.length; k += 2) {
      var idxObj = ctx.lookup(arr[k]);
      var dictObj = ctx.lookup(arr[k + 1]);
      if (!idxObj || !dictObj || !dictObj.get) { continue; }
      var startIdx = idxObj.asNumber ? idxObj.asNumber() : Number(idxObj);
      var style = dictObj.get(PDFName.of('S'));
      var stObj = dictObj.get(PDFName.of('St'));
      var st = stObj ? (stObj.asNumber ? stObj.asNumber() : Number(stObj)) : 1;
      var nextIdx = numPages;
      if (k + 2 < arr.length) {
        var nxt = ctx.lookup(arr[k + 2]);
        if (nxt && nxt.asNumber) { nextIdx = nxt.asNumber(); }
      }
      var isDecimal = String(style) === '/D';
      for (var i2 = startIdx; i2 < nextIdx && i2 < numPages; i2++) {
        labels[i2] = isDecimal ? String(st + (i2 - startIdx)) : String(i2 + 1);
      }
    }
    return labels;
  }
  
  function rebuildPageLabels(doc, remainingLabels){
    var ctx = doc.context;
    var PDFName = window.PDFLib.PDFName;
    var PDFNumber = window.PDFLib.PDFNumber;
    var PDFDict = window.PDFLib.PDFDict;
    var PDFArray = window.PDFLib.PDFArray;
    var nums = PDFArray.withContext(ctx);
    for (var i = 0; i < remainingLabels.length; i++) {
      var cur = parseInt(remainingLabels[i], 10);
      if (isNaN(cur)) { continue; }
      var prev = i > 0 ? parseInt(remainingLabels[i - 1], 10) : NaN;
      if (i === 0 || isNaN(prev) || cur !== prev + 1) {
        var dict = PDFDict.withContext(ctx);
        dict.set(PDFName.of('S'), PDFName.of('D'));
        dict.set(PDFName.of('St'), PDFNumber.of(cur));
        nums.push(PDFNumber.of(i));
        nums.push(dict);
      }
    }
    var pl = PDFDict.withContext(ctx);
    pl.set(PDFName.of('Nums'), nums);
    doc.catalog.set(PDFName.of('PageLabels'), pl);
  }
  function fetchAndRemove(url, removePages){
    return fetch(url).then(function(resp){
      if (!resp.ok) { throw new Error('PDF 下載失敗 HTTP ' + resp.status); }
      return resp.arrayBuffer();
    }).then(function(buf){
      return loadPdfLib().then(function(PDFLib){
        return PDFLib.PDFDocument.load(buf, { ignoreEncryption: true }).then(function(doc){
          var origLabels = readPageLabels(doc);
          var removeSet = {};
          removePages.forEach(function(p){ removeSet[p] = true; });
          var remainingLabels = origLabels.filter(function(_, i){ return !removeSet[i + 1]; });
          var sorted = removePages.slice().sort(function(a, b){ return b - a; });
          sorted.forEach(function(p){ if (p >= 1 && p <= doc.getPageCount()) { doc.removePage(p - 1); } });
          rebuildPageLabels(doc, remainingLabels);
          return doc.save();
        });
      });
    }).then(function(bytes){
      return pdfjsLib.getDocument({data: bytes}).promise;
    });
  }
  var removePages = getRemovePages();
  var docPromise = removePages
    ? fetchAndRemove(fileUrl, removePages)
    : pdfjsLib.getDocument({url: fileUrl}).promise;
  docPromise.then(function(doc){
    pdfDoc = doc;
    numPages = doc.numPages;
    statusBox.style.display = 'none';
    pageInfo.textContent = '1 / ' + numPages;
    
    if (doc.getPageLabels) {
      doc.getPageLabels().then(function(labels){
        if (labels && labels.length === numPages) {
          pageLabels = labels;
          updateCurrentUI();
        }
      }).catch(function(){});
    }
    return doc.getPage(1);
  }).then(function(page1){
    var vp1 = page1.getViewport({scale: 1});
    vp1W = vp1.width; vp1H = vp1.height;
    var aspect = vp1W + ' / ' + vp1H;
    for (var i = 1; i <= numPages; i++) {
      var div = document.createElement('div');
      div.className = 'qxpdf-page';
      div.setAttribute('data-page', i);
      div.style.aspectRatio = aspect;
      div.style.width = basePageWidth() + 'px';
      pagesBox.appendChild(div);
      pageDivs.push(div);
      io.observe(div);
    }
    applyZoomTransform();
    renderPage(1);
    loadOutline(pdfDoc);
  }).catch(function(err){
    var msg = '打不开这个 PDF。';
    if (err && ('' + err.message).indexOf('CORS') >= 0) {
      msg = '打不开这个 PDF，可能是跨域（CORS）问题。';
    }
    fail(msg);
    tocBox.textContent = '目录没能载入。';
  });
})();
</script>

<script>
(function(){
  var containers = document.querySelectorAll('.cards');
  if (!containers.length) return;
  var view = localStorage.getItem('qx-view') || 'list';
  if (window.matchMedia('(max-width: 700px)').matches) view = 'list';
  var GRID_ICON = '<svg width="13" height="13" viewBox="0 0 14 14" style="vertical-align:-2px" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="1" width="5" height="5"/><rect x="8" y="1" width="5" height="5"/><rect x="1" y="8" width="5" height="5"/><rect x="8" y="8" width="5" height="5"/></g></svg>';
  var LIST_ICON = '<svg width="13" height="13" viewBox="0 0 14 14" style="vertical-align:-2px" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="1" y1="3" x2="13" y2="3"/><line x1="1" y1="7" x2="13" y2="7"/><line x1="1" y1="11" x2="13" y2="11"/></g></svg>';
  var sizes = { list: 5, grid: 4 };
  var page = 1;
  var shown = sizes[view];
  var pagerNav = document.querySelector('.js-pager');
  var moreBtn = document.querySelector('.load-more');
  var pageKey = 'qx-page:' + location.pathname;
  if (pagerNav && !moreBtn) {
    try { var sv = parseInt(sessionStorage.getItem(pageKey), 10); if (sv > 1) page = sv; } catch(e) {}
  }
  function render(){
    var size = sizes[view];
    containers.forEach(function(c){
      c.classList.toggle('grid', view === 'grid');
      var cards = c.querySelectorAll('.card');
      if (moreBtn) {
        cards.forEach(function(card, i){ card.style.display = i < shown ? '' : 'none'; });
        moreBtn.style.display = shown < cards.length ? '' : 'none';
      } else if (pagerNav) {
        var pages = Math.max(1, Math.ceil(cards.length / size));
        if (page > pages) page = pages;
        try { sessionStorage.setItem(pageKey, page); } catch(e) {}
        cards.forEach(function(card, i){
          card.style.display = (Math.floor(i / size) === page - 1) ? '' : 'none';
        });
        if (pages <= 1) { pagerNav.innerHTML = ''; return; }
        var seq = [];
        if (pages <= 7) { for (var i = 1; i <= pages; i++) seq.push(i); }
        else {
          var keep = {};
          keep[1] = keep[pages] = keep[page] = true;
          if (page - 1 >= 1) keep[page - 1] = true;
          if (page + 1 <= pages) keep[page + 1] = true;
          var lastN = 0;
          for (var n = 1; n <= pages; n++) {
            if (!keep[n]) continue;
            if (lastN && n - lastN > 1) seq.push('…');
            seq.push(n); lastN = n;
          }
        }
        var html = '<button data-pg="first"' + (page === 1 ? ' disabled' : '') + '>第一頁</button>';
        html += '<button data-pg="prev"' + (page === 1 ? ' disabled' : '') + '>← 上一頁</button>';
        seq.forEach(function(it){
          if (it === '…') html += '<span class="gap">…</span>';
          else html += '<button data-pg="' + it + '"' + (it === page ? ' class="active"' : '') + '>' + it + '</button>';
        });
        html += '<button data-pg="next"' + (page === pages ? ' disabled' : '') + '>下一頁 →</button>';
        html += '<button data-pg="last"' + (page === pages ? ' disabled' : '') + '>最後一頁</button>';
        pagerNav.innerHTML = html;
        pagerNav.querySelectorAll('button').forEach(function(b){
          b.addEventListener('click', function(){
            var v = b.dataset.pg;
            if (v === 'prev') page--; else if (v === 'next') page++;
            else if (v === 'first') page = 1; else if (v === 'last') page = pages;
            else page = parseInt(v, 10);
            render();
            window.scrollTo({ top: c.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' });
          });
        });
      }
    });
    var vt = document.getElementById('viewToggle');
    if (vt) { vt.innerHTML = (view === 'list') ? GRID_ICON : LIST_ICON; if (window.QX_APPLY) window.QX_APPLY(vt); }
    if (pagerNav && window.QX_APPLY) window.QX_APPLY(pagerNav);
    localStorage.setItem('qx-view', view);
  }
  if (moreBtn) moreBtn.addEventListener('click', function(){ shown += sizes[view]; render(); });
  var vtBtn = document.getElementById('viewToggle');
  if (vtBtn) vtBtn.addEventListener('click', function(){
    view = (view === 'list') ? 'grid' : 'list'; page = 1; shown = sizes[view]; render();
  });
  render();
})();
</script>

<script>

window.QX_APPLY = null;
(function(){
  var btn = document.getElementById('langToggle');
  if (!btn || !window.QX_T2S) return;
  var originals = [], origTitle = document.title, applied = false;
  function skipped(n){
    var el = n.parentElement;
    while (el) { if (el.id === 'langToggle' || el.id === 'themeToggle') return true; el = el.parentElement; }
    return false;
  }
  function convertRoot(root){
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var par = n.parentElement;
        if (!par) return NodeFilter.FILTER_REJECT;
        if (par.tagName === 'SCRIPT' || par.tagName === 'STYLE') return NodeFilter.FILTER_REJECT;
        if (skipped(n)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(n){
      var found = null;
      for (var i = 0; i < originals.length; i++) if (originals[i].n === n) { found = originals[i]; break; }
      if (!found) { found = { n: n, t: n.nodeValue }; originals.push(found); }
      n.nodeValue = window.QX_T2S(found.t);
    });
  }
  window.QX_APPLY = function(root){ if (applied && root) convertRoot(root); };
  function apply(){ applied = true; document.documentElement.dataset.lang = 's'; convertRoot(document.body); document.title = window.QX_T2S(origTitle); }
  function restore(){
    applied = false;
    originals.forEach(function(o){ try { o.n.nodeValue = o.t; } catch(e){} });
    originals = [];
    document.title = origTitle;
    delete document.documentElement.dataset.lang;
  }
  function isS(){ try { return localStorage.getItem('qx-lang') === 's'; } catch(e){ return false; } }
  function sync(){ btn.textContent = isS() ? '繁體' : '簡體'; }
  btn.addEventListener('click', function(){
    if (isS()) { try{ localStorage.removeItem('qx-lang'); }catch(e){} restore(); }
    else { try{ localStorage.setItem('qx-lang', 's'); }catch(e){} apply(); }
    sync();
  });
  if (isS()) apply();
  sync();
})();
</script>
<script>

(function(){
  var input = document.getElementById('siteSearch');
  var panel = document.getElementById('searchPanel');
  if (!input || !panel) return;
  var DATA = null, loading = null;
  function load(){
    if (DATA) return Promise.resolve();
    if (loading) return loading;
    loading = fetch('\/index.json').then(function(r){ return r.json(); }).then(function(d){
      DATA = d.map(function(a){
        var hayT = (a.title + ' ' + a.authors + ' ' + a.cat + ' ' + a.issue + ' ' + a.intro + ' ' + a.text).toLowerCase();
        return { a: a, hayT: hayT, hayS: window.QX_T2S ? window.QX_T2S(hayT) : '' };
      });
    }).catch(function(){ DATA = []; });
    return loading;
  }
  function esc(t){ var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  function render(){
    var q = input.value.trim().toLowerCase();
    if (!q || !DATA) { panel.hidden = true; panel.innerHTML = ''; return; }
    var hits = DATA.filter(function(x){ return x.hayT.indexOf(q) >= 0 || (x.hayS && x.hayS.indexOf(q) >= 0); });
    if (!hits.length) {
      panel.innerHTML = '<div class="sp-empty">沒有找到相關文章</div>';
    } else {
      panel.innerHTML = hits.slice(0, 6).map(function(x){
        var a = x.a;
        return '<a class="sp-item" href="' + a.url + '"><span class="sp-title">' + esc(a.title) + '</span>' +
               '<span class="sp-meta">' + esc(a.authors) + (a.issue ? ' · ' + esc(a.issue) : '') + '</span></a>';
      }).join('') + '<a class="sp-all" href="\/search\/?q=' + encodeURIComponent(input.value.trim()) + '">看全部 ' + hits.length + ' 篇結果 →</a>';
    }
    panel.hidden = false;
    if (window.QX_APPLY) window.QX_APPLY(panel);
  }
  var timer;
  input.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){ load().then(render); }, 120);
  });
  input.addEventListener('focus', function(){ load().then(function(){ if (input.value.trim()) render(); }); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter') {
      e.preventDefault();
      var q = input.value.trim();
      if (q) location.href = '\/search\/?q=' + encodeURIComponent(q);
    }
    if (e.key === 'Escape') panel.hidden = true;
  });
  document.addEventListener('click', function(e){ if (!e.target.closest('.search-box')) panel.hidden = true; });
})();
</script>

<script>
(function(){
  var main = document.querySelector('.listen-btn');
  if (!main) return;
  if (!('speechSynthesis' in window)) { main.style.display = 'none'; return; }
  var stopBtn = document.querySelector('.listen-stop');
  var synth = window.speechSynthesis;
  var chunks = null, idx = 0, state = 'idle', curLang = 'zh-TW';
  function setLabel(t){ main.innerHTML = t; if (window.QX_APPLY) window.QX_APPLY(main); }
  function collect(){
    var body = document.querySelector('.article-body');
    if (!body) return [];
    var text;
    var pages = body.querySelectorAll('.pager-page');
    if (pages.length) {
      var vis = null;
      pages.forEach(function(pg){ if (pg.style.display !== 'none') vis = pg; });
      text = vis ? (vis.textContent || '') : '';
      curLang = 'zh-TW';
    } else if (body.querySelector('.tabs')) {
      var panes = body.querySelectorAll('.tab-pane');
      var cands = [];
      panes.forEach(function(pn){ if (!pn.classList.contains('tab-left')) cands.push(pn); });
      var pick = null;
      cands.forEach(function(pn){ if (pn.style.display !== 'none') pick = pn; });
      if (!pick) pick = cands[0];
      if (pick) {
        var ptext = (pick.textContent || '');
        var letters = (ptext.match(/[A-Za-z]/g) || []).length;
        var cjk = (ptext.match(/[\u4e00-\u9fff]/g) || []).length;
        curLang = (letters > cjk) ? 'en-US' : 'zh-TW';
        if (curLang === 'zh-TW') {
          var t2 = document.querySelector('.article-head h2, .foreword-page h2');
          text = (t2 ? t2.textContent + '。' : '') + ' ' + ptext;
        } else text = ptext;
      } else {
        var title2 = document.querySelector('.article-head h2, .foreword-page h2');
        text = (title2 ? title2.textContent + '。' : '') + ' ' + (body.textContent || '');
        curLang = 'zh-TW';
      }
    } else {
      var title = document.querySelector('.article-head h2, .foreword-page h2');
      text = (title ? title.textContent + '。' : '') + ' ' + (body.textContent || '');
      curLang = 'zh-TW';
    }
    text = text.replace(/\s+/g, ' ').trim();
    var pieces = text.match(/[^。！？；….!?]+[。！？；….!?]?/g) || [text];
    var segs = [];
    pieces.forEach(function(x){
      x = x.trim(); if (!x) return;
      while (x.length > 80) {
        var cut = -1;
        for (var i = 40; i < 80 && i < x.length; i++) { if ('，、：,;:'.indexOf(x[i]) >= 0) cut = i + 1; }
        if (cut < 0) cut = 80;
        segs.push(x.slice(0, cut)); x = x.slice(cut);
      }
      if (x) segs.push(x);
    });
    var parts = [], buf = '';
    segs.forEach(function(x){
      if ((buf + x).length > 80) { if (buf) parts.push(buf); buf = x; } else buf += x;
    });
    if (buf) parts.push(buf);
    return parts;
  }
  function voice(){
    var vs = synth.getVoices();
    if (curLang === 'en-US') {
      return vs.filter(function(v){ return /^en[-_]US/i.test(v.lang); })[0]
          || vs.filter(function(v){ return /^en/i.test(v.lang); })[0] || null;
    }
    return vs.filter(function(v){ return /zh[-_]TW/i.test(v.lang); })[0]
        || vs.filter(function(v){ return /^zh/i.test(v.lang); })[0] || null;
  }
  function speak(){
    if (idx >= chunks.length) { reset(); return; }
    var u = new SpeechSynthesisUtterance(chunks[idx]);
    u.lang = curLang;
    u.rate = 0.92;
    var v = voice(); if (v) u.voice = v;
    u.onend = function(){ if (state === 'playing') { idx++; speak(); } };
    u.onerror = function(){ if (state === 'playing') { idx++; speak(); } };
    synth.speak(u);
  }
  function reset(){
    state = 'idle'; idx = 0;
    setLabel('<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19v-4a8 8 0 0 1 16 0v4"/><rect x="2.5" y="14" width="4" height="6.5" rx="1.8"/><rect x="17.5" y="14" width="4" height="6.5" rx="1.8"/></svg>聆聽');
    if (stopBtn) stopBtn.style.display = 'none';
  }
  main.addEventListener('click', function(){
    if (state === 'idle') {
      chunks = collect();
      if (!chunks.length) return;
      synth.cancel(); idx = 0; state = 'playing';
      setLabel('⏸ 暫停');
      if (stopBtn) stopBtn.style.display = '';
      setTimeout(function(){ if (state === 'playing') speak(); }, 60);
    } else if (state === 'playing') { state = 'paused'; synth.pause(); setLabel('▶ 繼續'); }
    else { state = 'playing'; synth.resume(); setLabel('⏸ 暫停'); }
  });
  if (stopBtn) stopBtn.addEventListener('click', function(){ synth.cancel(); reset(); });
  window.addEventListener('beforeunload', function(){ synth.cancel(); });
})();
</script>

<script>
(function(){
  var groups = document.querySelectorAll('.toc-group');
  if (!groups.length) return;
  var note = document.querySelector('.toc-count');
  var orig = note ? note.textContent : '';
  var active = null;
  function syncCols(){
    document.querySelectorAll('.toc-col').forEach(function(col){
      var any = false;
      col.querySelectorAll('.toc-group').forEach(function(g){ if (g.style.display !== 'none') any = true; });
      col.style.display = any ? '' : 'none';
    });
  }
  function showAll(){
    active = null;
    groups.forEach(function(x){
      x.style.display = '';
      var b = x.querySelector('.toc-cat-btn'); if (b) b.classList.remove('active');
    });
    syncCols();
    if (note) { note.textContent = orig; if (window.QX_APPLY) window.QX_APPLY(note); }
  }
  groups.forEach(function(g){
    var btn = g.querySelector('.toc-cat-btn');
    if (!btn) return;
    btn.addEventListener('click', function(){
      var cat = g.getAttribute('data-cat');
      if (active === cat) { showAll(); return; }
      active = cat;
      groups.forEach(function(x){
        var on = x.getAttribute('data-cat') === cat;
        x.style.display = on ? '' : 'none';
        var b = x.querySelector('.toc-cat-btn'); if (b) b.classList.toggle('active', on);
      });
      syncCols();
      if (note) {
        note.textContent = '這一期共有 ' + document.querySelectorAll('.toc-list li').length + ' 篇，現在只看「' + cat + '」';
        if (window.QX_APPLY) window.QX_APPLY(note);
      }
    });
  });
})();
</script>
<script>
(function(){
  var KEY = 'qx-hist', MAX = 5;  
  var hist = [];
  try { hist = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch(e) { hist = []; }
  hist = hist.filter(function(h){ return h && h.u; });
  var here = location.pathname + location.search;
  var title = (document.title || '').replace(/\s*\|\s*千橡雜誌\s*$/, '').trim();
  if (!title || title === '千橡雜誌') title = '首頁';
  var goingBack = false;
  try { goingBack = sessionStorage.getItem('qx-goback') === '1'; sessionStorage.removeItem('qx-goback'); } catch(e) {}
  if (!goingBack && (!hist.length || hist[hist.length - 1].u !== here)) {
    hist.push({ u: here, t: title });
    while (hist.length > MAX) hist.shift();
    try { sessionStorage.setItem(KEY, JSON.stringify(hist)); } catch(e) {}
  }
  var btn = document.getElementById('goBack');
  if (!btn) return;
  var target = hist.length >= 2 ? hist[hist.length - 2] : null;
  function short(t){ return t.length > 12 ? t.slice(0, 12) + '…' : t; }
  if (target) {
    btn.title = '返回' + short(target.t);
    btn.classList.add('show');
    btn.addEventListener('click', function(){
      hist.pop();
      try {
        sessionStorage.setItem(KEY, JSON.stringify(hist));
        sessionStorage.setItem('qx-goback', '1');
      } catch(e) {}
      location.href = target.u;
    });
    return;
  }
  
  var tocLink = document.querySelector('.article-head a[href*="/issues/"], .article-body a[href*="/issues/"]');
  if (tocLink && document.querySelector('.article-head')) {
    btn.title = '回本期目錄';
    btn.classList.add('show');
    btn.addEventListener('click', function(){ location.href = tocLink.getAttribute('href'); });
  }
})();
</script>
<script>
(function(){
  function closeAll(except){ document.querySelectorAll('.qx-dd.open').forEach(function(d){ if(d!==except){ d.classList.remove('open'); d.querySelector('.qx-dd-list').hidden = true; d.querySelector('.qx-dd-btn').setAttribute('aria-expanded','false'); } }); }
  window.qxDDSet = function(id, val){
    var inp = document.getElementById(id); if(!inp) return;
    var dd = document.querySelector('.qx-dd[data-for="'+id+'"]'); if(!dd) { inp.value = val; return; }
    var items = dd.querySelectorAll('.qx-dd-list button'), hit = null;
    items.forEach(function(b){ if(b.getAttribute('data-v') === String(val) || b.textContent === String(val)) hit = b; });
    if(!hit) return;
    inp.value = hit.getAttribute('data-v');
    dd.querySelector('.qx-dd-lab').textContent = hit.textContent;
    items.forEach(function(b){ b.classList.toggle('on', b===hit); });
  };
  document.querySelectorAll('.qx-dd').forEach(function(dd){
    var btn = dd.querySelector('.qx-dd-btn'), list = dd.querySelector('.qx-dd-list'), inp = document.getElementById(dd.getAttribute('data-for'));
    btn.addEventListener('click', function(e){ e.stopPropagation(); var open = dd.classList.contains('open'); closeAll(dd); dd.classList.toggle('open', !open); list.hidden = open; btn.setAttribute('aria-expanded', String(!open)); });
    list.querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ window.qxDDSet(dd.getAttribute('data-for'), b.getAttribute('data-v')); closeAll(null); if(inp){ inp.dispatchEvent(new Event('change', {bubbles:true})); } }); });
  });
  document.addEventListener('click', function(){ closeAll(null); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeAll(null); });
})();
</script>

(function(){
  var box = document.getElementById('qxAds');

  var tab = document.getElementById('qxAdsTab');
  var closeBtn = document.getElementById('qxAdsClose');
  function setOpen(open){
    box.classList.toggle('open', open);
    tab.setAttribute('aria-expanded', String(open));
  }
  tab.addEventListener('click', function(e){ e.stopPropagation(); setOpen(!box.classList.contains('open')); });
  closeBtn.addEventListener('click', function(e){ e.stopPropagation(); setOpen(false); });

<script>
 
(function(){
  var box = document.getElementById('qxAdsRoll');
  if (!box) { return; }
  var ads = [
    {src:'/images/ads/ad-raymac.jpg', alt:'Ray-MAC Painting 油漆'},
    {src:'/images/ads/ad-spring2027.jpg', alt:'2027 羊年新春晚會'},
    {src:'/images/ads/ad-ccca.jpg', alt:'康谷中華文化中心'},

    {src:'/images/ads/ad-meihuang.jpg', alt:'林美秀 Engel & Völkers 房地產'},
    {src:'/images/ads/ad-kayyue.jpg', alt:'樂華會計 H Kay Yue'},
    {src:'/images/ads/ad-candyli.jpg', alt:'Candy Li 千橡房地產'},
    {src:'/images/ads/ad-hollywu.jpg', alt:'Holly Wu 伍雄麗房地產'},
    {src:'/images/ads/ad-katyho.jpg', alt:'Katy Ho 賀凱蒂 RE/MAX'},
    {src:'/images/ads/ad-topcut.jpg', alt:'Top Cut 美髮'},
    {src:'/images/ads/ad-guanyin.jpg', alt:'洛杉磯觀音堂'}
  ];
  var idx = 0, timer = null;
  var img = document.getElementById('qxAdsRollImg');
  var link = document.getElementById('qxAdsRollLink');
  var dotsBox = document.getElementById('qxAdsRollDots');
  ads.forEach(function(a, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', '第 ' + (i+1) + ' 個廣告：' + a.alt);
    b.addEventListener('click', function(){ showAd(i); restart(); });
    dotsBox.appendChild(b);
  });
  var dots = dotsBox.querySelectorAll('button');
  function updateDots(){
    for (var i=0;i<dots.length;i++){ dots[i].classList.toggle('on', i===idx); }
  }
  function showAd(i){
    idx = (i + ads.length) % ads.length;
    var a = ads[idx];
    img.style.opacity = 0;
    var done = false;
    function reveal(){ if(!done){ done=true; img.style.opacity = 1; } }
    img.onload = reveal;
    img.src = a.src;
    img.alt = a.alt;
    link.href = a.src;
    link.setAttribute('aria-label', a.alt + '（點開看大圖）');
    setTimeout(reveal, 600);
    updateDots();
  }
  function restart(){
    if (timer) { clearInterval(timer); }
    timer = setInterval(function(){ showAd(idx+1); }, 5000);
  }
  document.getElementById('qxAdsRollPrev').addEventListener('click', function(){ showAd(idx-1); restart(); });
  document.getElementById('qxAdsRollNext').addEventListener('click', function(){ showAd(idx+1); restart(); });
  box.addEventListener('mouseenter', function(){ if (timer) { clearInterval(timer); timer = null; } });
  box.addEventListener('mouseleave', function(){ restart(); });
  updateDots();
  restart();
})();
</script>
